server:
  port: ${SERVER_PORT:-8080}
  mode: ${GIN_MODE:-release}

database:
  host: ${DB_HOST:-127.0.0.1}
  port: ${DB_PORT:-3306}
  user: ${DB_USER:-root}
  password: ${DB_PASSWORD:-root}
  dbname: ${DB_NAME:-furniture_commission}
  max_idle_conns: ${DB_MAX_IDLE_CONNS:-10}
  max_open_conns: ${DB_MAX_OPEN_CONNS:-100}

jwt:
  secret: ${JWT_SECRET:-furniture-commission-secret-key-2026}
  expire_hours: ${JWT_EXPIRE_HOURS:-24}

log:
  level: ${LOG_LEVEL:-info}
  file: ${LOG_FILE:-logs/app.log}

cors:
  allowed_origins:
    - ${CORS_ORIGIN_1:-https://www.jiaju.com}
    - ${CORS_ORIGIN_2:-http://localhost:8080}
    - ${CORS_ORIGIN_3:-http://127.0.0.1:8080}

upload:
  dir: ${UPLOAD_DIR:-./uploads}
  base_url: ${UPLOAD_BASE_URL:-http://localhost:8080/uploads}
