basePath: /api
definitions:
  furniture-commission_internal_service.AddGiftStockRequest:
    properties:
      purchase_price:
        type: number
      quantity:
        minimum: 1
        type: integer
      warehouse_id:
        type: integer
    required:
    - quantity
    - warehouse_id
    type: object
  furniture-commission_internal_service.CreateCategoryRequest:
    properties:
      category_code:
        example: CAT001
        type: string
      category_name:
        example: 沙发
        type: string
      sort_order:
        type: integer
      store_id:
        type: integer
    required:
    - category_code
    - category_name
    type: object
  furniture-commission_internal_service.CreateGiftRequest:
    properties:
      cost_price:
        type: number
      gift_code:
        example: GIFT001
        type: string
      gift_image:
        example: https://example.com/gift/pillow.jpg
        type: string
      gift_name:
        example: 精美抱枕
        type: string
      store_id:
        type: integer
      warning_stock:
        type: integer
    required:
    - gift_code
    - gift_name
    type: object
  furniture-commission_internal_service.CreateProductRequest:
    properties:
      brand:
        example: 品牌A
        type: string
      category_id:
        type: integer
      cost_price:
        type: number
      description:
        example: 高档真皮沙发，三座位
        type: string
      list_price:
        type: number
      min_price:
        type: number
      product_code:
        example: P001
        type: string
      product_image:
        example: https://example.com/product/sofa.jpg
        type: string
      product_name:
        example: 真皮沙发
        type: string
      reference_cost:
        type: number
      store_id:
        type: integer
      total_cost_rate:
        type: number
      warning_stock:
        type: integer
    required:
    - product_name
    type: object
  furniture-commission_internal_service.CreatePurchaseItemRequest:
    properties:
      product_name:
        example: 真皮沙发
        type: string
      purchase_price:
        type: number
      quantity:
        minimum: 1
        type: integer
      sku_id:
        type: integer
      sku_name:
        example: 真皮沙发-棕色-三座
        type: string
    required:
    - purchase_price
    - quantity
    - sku_id
    type: object
  furniture-commission_internal_service.CreatePurchaseOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/furniture-commission_internal_service.CreatePurchaseItemRequest'
        minItems: 1
        type: array
      remark:
        example: 紧急采购
        type: string
      store_id:
        type: integer
      supplier_id:
        type: integer
      supplier_name:
        example: 某某供应商
        type: string
    required:
    - items
    type: object
  furniture-commission_internal_service.CreateRoleRequest:
    properties:
      description:
        example: 系统管理员角色
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      role_code:
        example: admin
        type: string
      role_name:
        example: 管理员
        type: string
      status:
        type: integer
    required:
    - role_code
    - role_name
    type: object
  furniture-commission_internal_service.CreateSKURequest:
    properties:
      attributes:
        example: 颜色:棕色;规格:三座
        type: string
      barcode:
        example: "6901234567890"
        type: string
      product_id:
        type: integer
      sku_code:
        example: SKU001
        type: string
      sku_name:
        example: 真皮沙发-棕色-三座
        type: string
    required:
    - sku_code
    - sku_name
    type: object
  furniture-commission_internal_service.CreateStoreRequest:
    properties:
      address:
        type: string
      contact_phone:
        type: string
      status:
        type: integer
      store_code:
        type: string
      store_name:
        type: string
    required:
    - address
    - store_code
    - store_name
    type: object
  furniture-commission_internal_service.CreateUserRequest:
    properties:
      bank_account:
        example: "6222021234567890123"
        type: string
      bank_name:
        example: 中国工商银行
        type: string
      base_salary:
        type: number
      department_id:
        type: integer
      email:
        example: zhangsan@example.com
        type: string
      employee_no:
        example: EMP001
        type: string
      entry_date:
        example: "2024-01-01"
        type: string
      id_card:
        example: "110101199001011234"
        type: string
      is_formal:
        type: integer
      parent_id:
        type: integer
      password:
        example: "123456"
        minLength: 6
        type: string
      phone:
        example: "13800138000"
        type: string
      probation_end_date:
        example: "2024-04-01"
        type: string
      real_name:
        example: 张三
        type: string
      referrer_id:
        type: integer
      role:
        type: integer
      role_ids:
        items:
          type: integer
        type: array
      store_id:
        type: integer
      username:
        example: zhangsan
        type: string
    required:
    - password
    - username
    type: object
  furniture-commission_internal_service.CreateWarehouseRequest:
    properties:
      address:
        example: 北京市大兴区某某仓库区
        type: string
      contact_name:
        example: 周八
        type: string
      contact_phone:
        example: "13400134000"
        type: string
      status:
        type: integer
      store_id:
        type: integer
      warehouse_code:
        example: WH001
        type: string
      warehouse_name:
        example: 总仓
        type: string
      warehouse_type:
        type: integer
    required:
    - warehouse_code
    - warehouse_name
    - warehouse_type
    type: object
  furniture-commission_internal_service.UpdateCategoryRequest:
    properties:
      category_name:
        example: 沙发
        type: string
      sort_order:
        type: integer
      status:
        type: integer
    type: object
  furniture-commission_internal_service.UpdateGiftRequest:
    properties:
      cost_price:
        type: number
      gift_image:
        example: https://example.com/gift/pillow.jpg
        type: string
      gift_name:
        example: 精美抱枕
        type: string
      status:
        type: integer
      warning_stock:
        type: integer
    type: object
  furniture-commission_internal_service.UpdateProductRequest:
    properties:
      brand:
        example: 品牌A
        type: string
      category_id:
        type: integer
      cost_price:
        type: number
      description:
        example: 高档真皮沙发，三座位
        type: string
      list_price:
        type: number
      min_price:
        type: number
      product_image:
        example: https://example.com/product/sofa.jpg
        type: string
      product_name:
        example: 真皮沙发
        type: string
      reference_cost:
        type: number
      total_cost_rate:
        type: number
      warning_stock:
        type: integer
    type: object
  furniture-commission_internal_service.UpdateRoleRequest:
    properties:
      description:
        example: 系统管理员角色
        type: string
      permission_ids:
        items:
          type: integer
        type: array
      role_code:
        example: admin
        type: string
      role_name:
        example: 管理员
        type: string
      status:
        type: integer
    type: object
  furniture-commission_internal_service.UpdateStoreRequest:
    properties:
      address:
        type: string
      contact_phone:
        type: string
      status:
        type: integer
      store_name:
        type: string
    type: object
  furniture-commission_internal_service.UpdateUserRequest:
    properties:
      bank_account:
        example: "6222021234567890123"
        type: string
      bank_name:
        example: 中国工商银行
        type: string
      base_salary:
        type: number
      department_id:
        type: integer
      email:
        example: zhangsan@example.com
        type: string
      employee_no:
        example: EMP001
        type: string
      entry_date:
        example: "2024-01-01"
        type: string
      id_card:
        example: "110101199001011234"
        type: string
      is_formal:
        type: integer
      parent_id:
        type: integer
      phone:
        example: "13800138000"
        type: string
      probation_end_date:
        example: "2024-04-01"
        type: string
      real_name:
        example: 张三
        type: string
      referrer_id:
        type: integer
      role:
        type: integer
      status:
        type: integer
      store_id:
        type: integer
    type: object
  furniture-commission_internal_service.UpdateWarehouseRequest:
    properties:
      address:
        example: 北京市大兴区某某仓库区
        type: string
      contact_name:
        example: 周八
        type: string
      contact_phone:
        example: "13400134000"
        type: string
      status:
        type: integer
      store_id:
        type: integer
      warehouse_code:
        example: WH001
        type: string
      warehouse_name:
        example: 总仓
        type: string
      warehouse_type:
        type: integer
    type: object
  internal_handler.AssignPermissionsRequest:
    properties:
      permission_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - permission_ids
    type: object
  internal_handler.AssignRoleRequest:
    properties:
      role_ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    required:
    - role_ids
    type: object
  internal_handler.ConfirmReceiptRequest:
    properties:
      remark:
        example: 入库备注
        type: string
      warehouse_id:
        example: 1
        type: integer
    type: object
  internal_handler.GenerateSalaryRequest:
    properties:
      salary_month:
        example: 2024-01
        type: string
      store_id:
        example: 1
        type: integer
    required:
    - salary_month
    - store_id
    type: object
  internal_handler.PageData:
    properties:
      list: {}
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total:
        example: 100
        type: integer
    type: object
  internal_handler.Response:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      message:
        example: success
        type: string
      timestamp:
        example: 1715000000
        type: integer
    type: object
  internal_handler.SetConfigRequest:
    properties:
      config_key:
        example: commission_rate
        type: string
      config_type:
        example: string
        type: string
      config_value:
        example: "0.05"
        type: string
      remark:
        example: 提成比例
        type: string
    required:
    - config_key
    - config_value
    type: object
  internal_handler.SettleFundPoolRequest:
    properties:
      period_type:
        example: 1
        type: integer
      period_value:
        example: 2024-01
        type: string
      store_id:
        example: 1
        type: integer
    required:
    - period_type
    - period_value
    - store_id
    type: object
  internal_handler.UpdateConfigRequest:
    properties:
      config_value:
        example: "0.08"
        type: string
    required:
    - config_value
    type: object
  internal_handler.UpdateProductStatusRequest:
    properties:
      status:
        example: 1
        type: integer
    required:
    - status
    type: object
  internal_handler.UpdateUserStatusRequest:
    properties:
      status:
        example: 1
        type: integer
    type: object
  internal_handler.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API 支持
  description: 家具提成管理系统后端 API 接口文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 家具提成管理系统 API
  version: "1.0"
paths:
  /categories:
    get:
      consumes:
      - application/json
      description: 获取品类列表，可按门店ID筛选
      parameters:
      - description: 门店ID
        format: int64
        in: query
        name: store_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取品类列表
      tags:
      - 品类管理
    post:
      consumes:
      - application/json
      description: 创建新品类，需要管理员权限
      parameters:
      - description: 创建品类请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/furniture-commission_internal_service.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 创建品类
      tags:
      - 品类管理
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: 根据品类ID删除品类，需要管理员权限
      parameters:
      - description: 品类ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 删除品类
      tags:
      - 品类管理
    put:
      consumes:
      - application/json
      description: 根据品类ID更新品类信息，需要管理员权限
      parameters:
      - description: 品类ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: 更新品类请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/furniture-commission_internal_service.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 更新品类
      tags:
      - 品类管理
  /configs:
    get:
      consumes:
      - application/json
      description: 获取系统中所有配置项列表
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取所有系统配置
      tags:
      - 系统配置
    post:
      consumes:
      - application/json
      description: 新增系统配置项（管理员）
      parameters:
      - description: 配置信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SetConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 设置系统配置
      tags:
      - 系统配置
  /configs/{key}:
    get:
      consumes:
      - application/json
      description: 根据配置键获取对应的配置值
      parameters:
      - description: 配置键
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取单个配置
      tags:
      - 系统配置
    put:
      consumes:
      - application/json
      description: 根据配置键更新配置值（管理员）
      parameters:
      - description: 配置键
        in: path
        name: key
        required: true
        type: string
      - description: 更新配置请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 更新系统配置
      tags:
      - 系统配置
  /configs/commission-rates:
    get:
      consumes:
      - application/json
      description: 获取系统中所有提成比例相关的配置项
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取所有提成比例配置
      tags:
      - 系统配置
  /dashboard/overview:
    get:
      consumes:
      - application/json
      description: 获取当前门店的仪表盘概览数据，包括销售、订单、客户等核心指标
      parameters:
      - description: 门店ID（不传则使用当前用户门店）
        format: int64
        in: query
        name: store_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取仪表盘概览
      tags:
      - 仪表盘
  /fund-pools:
    get:
      consumes:
      - application/json
      description: 分页查询基金池列表，支持按门店和周期类型筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 门店ID
        in: query
        name: store_id
        type: string
      - description: 周期类型
        in: query
        name: period_type
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取基金池列表
      tags:
      - 基金池
  /fund-pools/{id}/shares:
    get:
      consumes:
      - application/json
      description: 根据基金池ID获取份额分配详情
      parameters:
      - description: 基金池ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取基金池份额详情
      tags:
      - 基金池
  /fund-pools/settle:
    post:
      consumes:
      - application/json
      description: 对指定门店和周期进行基金池结算（管理员）
      parameters:
      - description: 结算请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SettleFundPoolRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 基金池结算
      tags:
      - 基金池
  /gifts:
    get:
      consumes:
      - application/json
      description: 分页查询礼品列表，支持按门店、状态、关键词筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 门店ID
        format: int64
        in: query
        name: store_id
        type: integer
      - description: 状态
        format: int32
        in: query
        name: status
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 业务错误
          schema:
            $ref: '#/definitions/internal_handler.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/internal_handler.Response'
      security:
      - BearerAuth: []
      summary: 获取礼品列表
      tags:
      - 礼品管理
    post:
      consumes:
      - application/json
      description: 创建新礼品，需要管理员权限
      parameters:
      - description: 创建礼品请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/furniture-commission_internal_service.CreateGiftRequest'
      produces:
      - application/json
      responses:
        "200":
